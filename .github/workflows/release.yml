name: Release

# Cutting a release finishes with the plugin bundle -- main.js, manifest.json and
# styles.css -- attached to the GitHub Release. Obsidian installs the plugin from
# those three assets, so a release without them is unusable.
#
# There are two ways to get there:
#
#   workflow_dispatch -- the release is cut here. release-it bumps the version,
#     rebuilds through its `after:bump` hook, commits, tags, pushes and creates
#     the GitHub Release; the final step then uploads the bundle.
#
#   release: published -- release-it already ran somewhere else (your machine,
#     usually) and created the release. This job checks the tag out again,
#     rebuilds it and attaches the bundle to the release that already exists.
#
# A release created by the first path is deliberately not carried over into the
# second: events raised by a workflow's own GITHUB_TOKEN never start another
# run. That is why the first job uploads the assets itself rather than leaning
# on the second one.
#
# Two traps are worked around below. Both of them end the same way -- no new
# version is cut and the assets of the release that is already published get
# overwritten instead:
#
#   `pnpm run release -- --ci patch` hands release-it the argv
#     ["--", "--ci", "patch"]: pnpm forwards the `--` itself, yargs stops
#     parsing options at it, so `--ci` ends up as a positional argument and
#     `increment` becomes the literal string "--ci". release-it then finds no
#     usable increment at all, prints "No new version to release" and exits 0
#     without touching anything. Hence `pnpm exec release-it ...` below, which
#     passes its arguments through untouched.
#
#   A release-it run that does nothing still exits 0, and says so only on
#     stdout. So the version is captured before the run and checked afterwards,
#     together with the tag it is supposed to have created. Without that check
#     the upload step reads the unchanged version back out of package.json and
#     clobbers the release that is already published under that tag.

on:
  workflow_dispatch:
    inputs:
      increment:
        description: Version increment passed to release-it
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
          - premajor
          - preminor
          - prepatch
          - prerelease
      dry_run:
        description: Rehearse only -- no commit, no tag, no release
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Cut a release with release-it
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Only release from master
        run: |
          if [ "$GITHUB_REF_NAME" != "master" ]; then
            echo "::error::Releases are cut from master, but this run is on $GITHUB_REF_NAME."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # release-it needs the tags to work out the changelog, and it pushes
          # the release commit back.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      # No lockfile is committed here on purpose: this package is normally
      # installed by the obsidian-smart-sheet workspace, and a second lockfile
      # would only drift away from it.
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Configure the git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Remember the version we are releasing from
        id: before
        if: ${{ !inputs.dry_run }}
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # `pnpm exec`, not `pnpm run release -- ...`: the latter hands release-it
      # an argv that starts with `--`, which yargs reads as "end of options" and
      # turns the increment into the literal string "--ci". See the note at the
      # top of this file.
      - name: release-it
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          args="${{ inputs.increment }}"
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args="--dry-run $args"
          fi
          pnpm exec release-it --ci $args

      # release-it exits 0 when it concludes there is nothing to release, and it
      # only says so on stdout. Fail loudly here rather than letting the upload
      # step push this build over the release still published under the old tag.
      - name: Check that a new release was actually cut
        id: released
        if: ${{ !inputs.dry_run }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$version" = "${{ steps.before.outputs.version }}" ]; then
            echo "::error::release-it left the version at $version -- nothing was released."
            exit 1
          fi
          if ! git rev-parse -q --verify "refs/tags/$version" >/dev/null; then
            echo "::error::release-it did not create the tag $version."
            exit 1
          fi
          if [ "$(git rev-parse "$version^{commit}")" != "$(git rev-parse HEAD)" ]; then
            echo "::error::tag $version does not point at HEAD."
            exit 1
          fi
          echo "Released ${{ steps.before.outputs.version }} -> $version."
          echo "tag=$version" >> "$GITHUB_OUTPUT"

      # release-it's `after:bump` hook already builds, so this is a guard rather
      # than the normal path: it keeps the workflow honest if that hook ever
      # stops building.
      - name: Make sure the bundle exists
        if: ${{ !inputs.dry_run }}
        run: |
          if [ ! -f dist/main.js ]; then
            echo "dist/main.js is missing after release-it -- building it here."
            pnpm build
          fi

      - name: Check the built manifest matches the tag
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.released.outputs.tag }}
        run: |
          version="$(node -p "require('./dist/manifest.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Release $TAG would ship a manifest.json declaring $version."
            exit 1
          fi
          echo "manifest.json declares $version, matching $TAG."

      - name: Upload main.js, manifest.json and styles.css
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.released.outputs.tag }}
        run: |
          gh release upload "$TAG" \
            dist/main.js dist/manifest.json dist/styles.css \
            --clobber

  attach-assets:
    name: Attach the bundle to an existing release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Checkout the released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.6.5

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check the built manifest matches the tag
        run: |
          version="$(node -p "require('./dist/manifest.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Release $TAG would ship a manifest.json declaring $version."
            exit 1
          fi
          echo "manifest.json declares $version, matching $TAG."

      - name: Upload main.js, manifest.json and styles.css
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$TAG" \
            dist/main.js dist/manifest.json dist/styles.css \
            --clobber
